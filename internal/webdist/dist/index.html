    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts).
      (function () {
        var preference = 'system'
        try { preference = localStorage.getItem('portal.theme') || 'system' } catch (error) {}
        var light = preference === 'light' || (preference !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#f6f3ee' : '#141210')
      })()
    </script>
