name: release

# Push a tag like v1.2.3 to publish:
#   - GitHub Release with seat-hub_linux_{amd64,arm64} and checksums.txt
#     (what the in-site updater downloads and verifies)
#   - ghcr.io/duegin/seat-hub:v1.2.3 and :latest (linux/amd64 + linux/arm64)
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build frontend
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build
          rm -rf internal/webdist/dist
          cp -R web/dist internal/webdist/dist
      - run: go test ./...
      - name: Build binaries
        run: |
          set -eu
          build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ldflags="-s -w -X github.com/DueGin/seat-hub/internal/buildinfo.Version=${GITHUB_REF_NAME} -X github.com/DueGin/seat-hub/internal/buildinfo.Commit=${GITHUB_SHA} -X github.com/DueGin/seat-hub/internal/buildinfo.BuildTime=${build_time}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "dist/seat-hub_linux_${arch}" ./cmd/seat-hub
          done
          # The binary reports the tag it was built from (the updater checks this).
          test "$(./dist/seat-hub_linux_amd64 version | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')" = "${GITHUB_REF_NAME}"
          (cd dist && sha256sum seat-hub_linux_* > checksums.txt && cat checksums.txt)
      - name: Release notes
        run: |
          # The CHANGELOG.md section for this tag, or GitHub's generated notes.
          awk -v tag="## ${GITHUB_REF_NAME}" 'index($0, tag) == 1 {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > notes.md || true
          if [ -s notes.md ]; then echo "notes_flag=--notes-file notes.md" >> "$GITHUB_ENV"; else echo "notes_flag=--generate-notes" >> "$GITHUB_ENV"; fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --verify-tag ${notes_flag}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build time
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/duegin/seat-hub:${{ github.ref_name }}
            ghcr.io/duegin/seat-hub:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
